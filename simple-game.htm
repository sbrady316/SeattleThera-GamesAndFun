<!DOCTYPE html>
<html>

<head>
  <title>Typing Game</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    canvas {
      border: 1px solid black;
    }
    button {
      font-size: 20px;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <button id="restartButton">Restart Game</button>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const context = canvas.getContext('2d');

    let square = {
      x: 50,
      y: 50,
      size: 100,
      color: '#FF0000',
      dx: 0,
      dy: 0,
      score: 0,
    };

    let triangle = {
      x: 200,
      y: 200,
      size: 100,
      color: '#0000FF',
      dx: 0,
      dy: 0,
      score: 0,
    };

    let coin = {
      x: 0,
      y: 0,
      radius: 20,
      color: '#FFD700',
      active: false
    };

    let rulesdone = false; //sets the rules to not start dismissed
    let win = false; //can't have a player winning at the beginning of the game! (also, i need to define the boolean).
    let rulesOpacity = 1; // Start fully visible
    let rulesSize = 30;   // Start with a large font size

    function fadeOutRules() {
      if (rulesOpacity > 0) {
        rulesOpacity -= 0.02;
        rulesSize -= 0.5;
        requestAnimationFrame(fadeOutRules); // Smooth transition
      } else {
        rulesdone = true; // Mark rules as done
        rulesOpacity = 0;
        context.globalAlpha = 1; // Reset transparency for the rest of the game
        context.clearRect(0, 0, canvas.width, canvas.height); // Ensure rules are fully erased
        update(); // Ensure the game continues smoothly
      }
    }



    function drawRules(size) {
      if (!rulesdone) {
        context.fillStyle = '#000000';
        context.globalAlpha = rulesOpacity;
        context.font = `${size}px Arial`;
        context.textAlign = "center";
        context.fillText("The Rules are simple:", canvas.width / 2, 100);
        context.fillText("Square uses A, S, D, F. Triangle uses J, K, L, ;.", canvas.width / 2, 150);
        context.fillText("Race to get the coin!", canvas.width / 2, 200);
        context.fillText("Press SPACE to start.", canvas.width / 2, 250);
        context.globalAlpha = 1;  // Reset transparency for other game elements
      }
    }



    function handleKeyDown(event) {
      if (event.key === ' ') {
        fadeOutRules(); // Start fading the rules when SPACE is pressed
      }
    }


    function restartGame() {
      win = false;
      square.score = 0;
      square.x = 50;
      square.y = 50;
      triangle.score = 0;
      triangle.x = 200;
      triangle.y = 200;
      coin.active = false;
      rulesdone = false; // Make sure rules appear again after reset
      rulesOpacity = 1;  // Reset opacity so rules are visible
      spawnCoin();
      update(); // Restart the game loop
    }

    document.getElementById('restartButton').addEventListener('click', restartGame);

    function drawSquare() {
      context.fillStyle = square.color;
      context.fillRect(square.x, square.y, square.size, square.size);
    }

    function drawTriangle() {
      context.fillStyle = triangle.color;
      context.beginPath();
      context.moveTo(triangle.x, triangle.y);
      context.lineTo(triangle.x - triangle.size / 2, triangle.y + triangle.size);
      context.lineTo(triangle.x + triangle.size / 2, triangle.y + triangle.size);
      context.closePath();
      context.fill();
    }

    function drawCoin() {
      if (coin.active) {
        context.fillStyle = coin.color;
        context.beginPath();
        context.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
        context.fill();
           // Ensure text is positioned correctly and centered
    context.fillStyle = '#000000';
    context.font = '20px Arial';
    context.textAlign = "center";
    context.fillText(`Get the Coin!!`, canvas.width / 2, 50);
      }
    }

    function drawScores() {
      context.fillStyle = '#000000';
      context.font = '20px Arial';
      context.fillText(`Square: ${square.score}`, 10, 20);
      context.fillText(`Triangle: ${triangle.score}`, 10, 50);
    }

    function draw() {
      context.clearRect(0, 0, canvas.width, canvas.height);
      drawSquare();
      drawTriangle();
      drawCoin();
      drawScores();
    }

    function moveSquare() {
      square.x += square.dx;
      square.y += square.dy;
    }

    function moveTriangle() {
      triangle.x += triangle.dx;
      triangle.y += triangle.dy;
    }

    function movePlayers() {
      moveSquare();
      moveTriangle();
    }

    function spawnCoin() {
      coin.x = Math.random() * (canvas.width - 2 * coin.radius) + coin.radius;
      coin.y = Math.random() * (canvas.height - 2 * coin.radius) + coin.radius;
      coin.active = true;
    }

    function checkCollision(shape, coin) {
      const dx = shape.x - coin.x;
      const dy = shape.y - coin.y;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (shape.size) { // For square and triangle
        return distance < shape.size / 2 + coin.radius;
      }
    }

    function updateScores() {
      if (coin.active) {
        if (checkCollision(square, coin)) {
          square.score += 10;
          coin.active = false;
          setTimeout(spawnCoin, 2000); // Spawn a new coin after 2 seconds
        } else if (checkCollision(triangle, coin)) {
          triangle.score += 10;
          coin.active = false;
          setTimeout(spawnCoin, 2000); // Spawn a new coin after 2 seconds
        }
      }
    }

    function handleWin() {
      if (triangle.score >= 100) {
        context.fillStyle = '#000000';
        context.font = '50px Arial'; // Reduce font size
        context.textAlign = "center"; // Align text to center
        context.fillText(`Triangle Wins!`, canvas.width / 2, canvas.height / 2);
      }
      if (square.score >= 100) {
        context.fillStyle = '#000000';
        context.font = '50px Arial'; // Reduce font size
        context.textAlign = "center"; // Align text to center
        context.fillText(`Square Wins!`, canvas.width / 2, canvas.height / 2);
      }
    }

    function checkifWin() {
      if (square.score >= 100 || triangle.score >= 100) {//check if a player has the required score to win
        win = true;
      }
    }

    function update() {
      context.clearRect(0, 0, canvas.width, canvas.height);

      if (rulesOpacity > 0) {
        drawRules(rulesSize);
      } else {
        rulesdone = true;
      }

      if (rulesdone && !win) {
        movePlayers();
        updateScores();
        checkifWin();
        draw();
        requestAnimationFrame(update);
      } else if (win) {
        handleWin();
      }
    }
    
    function handleKeyDown(event) {
      const step = 10;
      switch (event.key) {
        case ' ':
          if (!rulesdone) {
            fadeOutRules(); // Start fading the rules when space is pressed
          } else {
            update(); // Start the game if rules are already gone
          }
          break;
        case 'd':
          square.dy = -step;
          break;
        case 's':
          square.dy = step;
          break;
        case 'a':
          square.dx = -step;
          break;
        case 'f':
          square.dx = step;
          break;
        case 'l':
          triangle.dy = -step;
          break;
        case 'k':
          triangle.dy = step;
          break;
        case 'j':
          triangle.dx = -step;
          break;
        case ';':
          triangle.dx = step;
          break;
      }
    }

    function handleKeyUp(event) {
      switch (event.key) {
        case ' ':
          rulesdone = true;
          break;
        case 'd':
        case 's':
          square.dy = 0;
          break;
        case 'f':
        case 'a':
          square.dx = 0;
          break;
        case 'k':
        case 'l':
          triangle.dy = 0;
          break;
        case 'j':
        case ';':
          triangle.dx = 0;
          break;
      }
    }

    window.addEventListener('keydown', handleKeyDown);
    window.addEventListener('keyup', handleKeyUp);

    function gameStart() {
      spawnCoin(); //initially spawn the coin
    }
    
    function runifnoWin() {
      if (win == false) {
        update();
      }
      if (win == true) {
        handleWin();
      }
    }

    function runAll() {
      gameStart();
      runifnoWin();
    }

    runAll();
  </script>
</body>

</html>
