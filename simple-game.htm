<!DOCTYPE html>
<html>

<head>
  <title>Typing Game</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    canvas {
      border: 1px solid black;
    }
  </style>
</head>

<body>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const context = canvas.getContext('2d');

    let square = {
      x: 50,
      y: 50,
      size: 100,
      color: '#FF0000',
      dx: 0,
      dy: 0,
      score: 0
    };

    let triangle = {
      x: 200,
      y: 200,
      size: 100,
      color: '#0000FF',
      dx: 0,
      dy: 0,
      score: 90
    };

    let coin = {
      x: 0,
      y: 0,
      radius: 20,
      color: '#FFD700',
      active: false
    };

    let rulesdone = false; //sets the rules to not start dismissed

    let win = false; //sets win to false

    function rules() {
      if (rulesdone == false) {
        context.fillStyle = '#000000';
        context.font = '50px Arial';
        context.fillText(`The Rules are simple:`, 50, 100);
        context.fillStyle = '#000000';
        context.font = '20px Arial';
        context.fillText(`The Triangle uses ' J, K, L, and ;'. The Square uses ' A, S, D, and F '.`, 50, 200)
        context.fillStyle = '#000000';
        context.font = '20px Arial';
        context.fillText(`When the coin shows up, race to get the coin.`, 50, 225)
        context.fillStyle = '#000000';
        context.font = '20px Arial';
        context.fillText(`To move the square, the following aplies;`, 50, 275)
        context.fillStyle = '#000000';
        context.font = '20px Arial';
        context.fillText(`Left is ' A ', right is ' F ', up is ' D ', and down is ' S '.`, 50, 325)
        context.fillStyle = '#000000';
        context.font = '20px Arial';
        context.fillText(`To move the triangle, the following aplies;`, 50, 375)
        context.fillStyle = '#000000';
        context.font = '20px Arial';
        context.fillText(`Left is ' J ', right is ' ; ', up is ' L ', and down is ' K '.`, 50, 425)
        context.fillStyle = '#808080';
        context.font = '20px Arial';
        context.fillText(`Press space to dismiss.`, 375, 500)
      }
    }

    function drawSquare() {
      context.fillStyle = square.color;
      context.fillRect(square.x, square.y, square.size, square.size);
    }

    function drawTriangle() {
      context.fillStyle = triangle.color;
      context.beginPath();
      context.moveTo(triangle.x, triangle.y);
      context.lineTo(triangle.x - triangle.size / 2, triangle.y + triangle.size);
      context.lineTo(triangle.x + triangle.size / 2, triangle.y + triangle.size);
      context.closePath();
      context.fill();
    }

    function drawCoin() {
      if (coin.active) {
        context.fillStyle = coin.color;
        context.beginPath();
        context.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
        context.fill();
        context.fillStyle = '#000000';
        context.font = '20px Arial';
        context.fillText(`Get the Coin!!`, 10, 90);
      }
    }

    function drawScores() {
      context.fillStyle = '#000000';
      context.font = '20px Arial';
      context.fillText(`Square: ${square.score}`, 10, 20);
      context.fillText(`Triangle: ${triangle.score}`, 10, 50);
    }

    function draw() {
      if (!rulesdone){
        rules();
      }
      else{
        context.clearRect(0, 0, canvas.width, canvas.height);
        drawSquare();
        drawTriangle();
        drawCoin();
        drawScores();
      }
    }

    function moveSquare() {
      square.x += square.dx;
      square.y += square.dy;
    }

    function moveTriangle() {
      triangle.x += triangle.dx;
      triangle.y += triangle.dy;
    }

    function moveAll() {
      moveSquare();
      moveTriangle();
    }

    function spawnCoin() {
      coin.x = Math.random() * (canvas.width - 2 * coin.radius) + coin.radius;
      coin.y = Math.random() * (canvas.height - 2 * coin.radius) + coin.radius;
      coin.active = true;
    }

    function checkCollision(shape, coin) {
      const dx = shape.x - coin.x;
      const dy = shape.y - coin.y;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (shape.size) { // For square and triangle
        return distance < shape.size / 2 + coin.radius;
      }
    }

    function updateScores() {
      if (coin.active) {
        if (checkCollision(square, coin)) {
          square.score += 10;
          coin.active = false;
          setTimeout(spawnCoin, 2000); // Spawn a new coin after 2 seconds
        } else if (checkCollision(triangle, coin)) {
          triangle.score += 10;
          coin.active = false;
          setTimeout(spawnCoin, 2000); // Spawn a new coin after 2 seconds
        }
      }
    }

    function checkWin() {
      if (square.score >= 100) {
        win = true;
        context.fillStyle = '#00AA00';
        context.font = '48px Arial';
        context.fillText('Square Wins!', canvas.width / 2 - 150, canvas.height / 2);
      } else if (triangle.score >= 100) {
        win = true;
        context.fillStyle = '#0000AA';
        context.font = '48px Arial';
        context.fillText('Triangle Wins!', canvas.width / 2 - 170, canvas.height / 2);
      }
    }

    function update() {
      if (!win) {
        moveSquare();
        moveTriangle();
        updateScores();
        draw();
        checkWin();
        requestAnimationFrame(update);
      }
    }

    function handleKeyDown(event) {
      const step = 10;
      switch (event.key) {
        case ' ':
          rulesdone = true;
          break;
        case 'd':
          square.dy = -step;
          break;
        case 's':
          square.dy = step;
          break;
        case 'a':
          square.dx = -step;
          break;
        case 'f':
          square.dx = step;
          break;
        case 'l':
          triangle.dy = -step;
          break;
        case 'k':
          triangle.dy = step;
          break;
        case 'j':
          triangle.dx = -step;
          break;
        case ';':
          triangle.dx = step;
          break;
      }
    }

    function handleKeyUp(event) {
      switch (event.key) {
        case ' ':
          rulesdone = true;
          break;
        case 'd':
        case 's':
          square.dy = 0;
          break;
        case 'f':
        case 'a':
          square.dx = 0;
          break;
        case 'k':
        case 'l':
          triangle.dy = 0;
          break;
        case 'j':
        case ';':
          triangle.dx = 0;
          break;
      }
    }

    window.addEventListener('keydown', handleKeyDown);
    window.addEventListener('keyup', handleKeyUp);

    // Initially spawn a coin
    spawnCoin();

    update();
  </script>
</body>

</html>
